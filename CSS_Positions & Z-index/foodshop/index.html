<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>FoodShop</title>
</head>
<body>
    <header>
        <div class="logo"><img src="../assets/imgs/logo.png" alt="logo"></div>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Menu</a></li>
                <li><a href="#">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="hero-section">
            <h1>Welcome to Online FoodShop</h1>
             <button type="button">Order Now</button>
             <div class="flex-categories">
                  <figure>
                    <img src="https://images.unsplash.com/photo-1513104890138-7c749659a591?w=600&auto=format&fit=crop" alt="Prices">
                    <button>Prices</button>
                  </figure>
                  <figure>
                    <img src="https://images.unsplash.com/photo-1561758033-d89a9ad46330?w=600&auto=format&fit=crop" alt="Specials">
                    <button>Specials</button>
                  </figure>
             </div>
        </div>
        <hr>
        <div class="Products">
             <h2>Featured Products</h2>
             <div class="Products-Categories">
                <figure id="img1">
                    <img src="https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=600&auto=format&fit=crop" alt="Cup Cake">
                    <button>Order Now</button>
                </figure>
                <figure id="img2">
                    <img src="https://images.unsplash.com/photo-1551024709-8f23befc6f87?w=600&auto=format&fit=crop" alt="Cold Drinks">
                    <button>Order Now</button>
                </figure>
                <figure id="img3">
                    <img src="https://images.unsplash.com/photo-1551183053-bf91a1d81141?w=600&auto=format&fit=crop" alt="Baked Dish">
                    <button>Order Now</button>
                </figure>
             </div>
        </div>
    </main>

    <footer>
        <p>Copyright &copy; 2026-2027 OnlineFoodShop. All Rights are reserved</p>
    </footer>
</body>
</html>
