<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Positions & Z-index</title>
</head>
<body>
    <header>
        <h1>This your first position & Z-index task</h1>
    </header>
    <main>
        <!-- Section 1 (First Position) -->
        <Section>
            <div id="div1">
            Div1 position=Relative 
            <div id="div3">
            Div3 position=absolute
            </div>
        </div>
        <div id="div2">
            Div2 position=fixed & z-index
        </div>
        </Section>
        <!-- Section 2 (Numbers) -->
        <Section class="numbers">
            <div id="num1">1</div>
            <div id="num2">2</div>
            <div id="num3">3</div>
            <div id="num4">4</div>
        </Section>
    </main>
</body>
</html>
